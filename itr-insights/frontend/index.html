<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ITR Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <main class="max-w-4xl mx-auto px-6 py-12">
      <header class="mb-10">
        <h1 class="text-3xl font-semibold tracking-tight">ITR Insights</h1>
        <p class="text-slate-600 mt-2">
          Upload your filed ITR-1 or ITR-2 PDF (AY 2024-25 or 2025-26) for a
          deduction-gap, anomaly, and narrative analysis. Nothing is stored.
        </p>
      </header>

      <section
        id="upload-card"
        class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm"
      >
        <form id="upload-form" class="flex flex-col gap-4">
          <label class="flex flex-col gap-2">
            <span class="text-sm font-medium">ITR PDF</span>
            <input
              type="file"
              name="file"
              accept="application/pdf"
              required
              class="block w-full text-sm file:mr-4 file:rounded-md file:border-0 file:bg-slate-900 file:px-4 file:py-2 file:text-white hover:file:bg-slate-700"
            />
          </label>
          <button
            type="submit"
            id="submit-btn"
            class="self-start rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-500 disabled:opacity-50"
          >
            Analyze
          </button>
        </form>
      </section>

      <section id="status" class="mt-6 hidden text-sm text-slate-600"></section>

      <section id="result" class="mt-8 hidden">
        <div id="summary" class="space-y-6"></div>
        <details class="mt-8">
          <summary class="cursor-pointer text-sm text-slate-500">
            Raw JSON
          </summary>
          <pre
            id="raw"
            class="mt-3 overflow-auto rounded-md bg-slate-900 p-4 text-xs text-slate-100"
          ></pre>
        </details>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
